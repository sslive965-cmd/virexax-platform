<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>VIREXA X — Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{background:#050505;color:#fff;min-height:100vh}
header{padding:14px 16px;border-bottom:1px solid rgba(255,0,0,.35);display:flex;justify-content:space-between;align-items:center;gap:12px;position:sticky;top:0;background:rgba(5,5,5,.94);backdrop-filter:blur(10px);z-index:20}
.logo{color:#f00;font-size:1.1rem;font-weight:800;text-shadow:0 0 12px rgba(255,0,0,.5)}
.admin{color:#aaa;font-size:.7rem}
.exit{background:transparent;color:#fff;border:1px solid rgba(255,0,0,.65);border-radius:10px;padding:9px 12px;font-weight:800;cursor:pointer}
main{max-width:900px;margin:auto;padding:22px 14px 35px}
h1{color:#f00;font-size:1.35rem;margin-bottom:18px;text-shadow:0 0 12px rgba(255,0,0,.35)}
.panel{background:#0b0b0b;border:1px solid rgba(255,0,0,.32);border-radius:16px;padding:17px;margin-bottom:18px;box-shadow:0 0 20px rgba(255,0,0,.05)}
.panel h2{font-size:.95rem;color:#f00;margin-bottom:14px}
.form{display:grid;gap:9px}
input,textarea,select{width:100%;padding:12px;border-radius:9px;border:1px solid rgba(255,0,0,.3);background:#070707;color:#fff;outline:none}
textarea{min-height:82px;resize:vertical}
input:focus,textarea:focus,select:focus{border-color:#f00}
button{padding:11px 13px;border:0;border-radius:9px;cursor:pointer;font-weight:700}
.primary{background:#f00;color:#fff;box-shadow:0 0 16px rgba(255,0,0,.25)}
.secondary{background:#181818;color:#fff;border:1px solid rgba(255,0,0,.35)}
.danger{background:#8f111b;color:#fff}
.msg{margin-top:10px;color:#aaa;font-size:.72rem;min-height:16px}
.product{border:1px solid rgba(255,0,0,.22);background:#080808;border-radius:13px;padding:14px;margin-top:12px}
.product-title{color:#f00;font-weight:800;margin-bottom:9px}
.row{display:flex;justify-content:space-between;gap:12px;padding:5px 0;color:#aaa;font-size:.72rem}
.row span:last-child{color:#eee;text-align:right;word-break:break-word}
.actions{display:flex;gap:8px;margin-top:11px}
.actions button{flex:1}
.form-actions{display:flex;gap:8px}
.form-actions button{flex:1}
.badge{display:inline-block;padding:4px 8px;border:1px solid rgba(255,0,0,.45);border-radius:20px;color:#ff6666;font-size:.6rem;margin-bottom:9px}
.small{font-size:.65rem;color:#777;margin-bottom:10px}
.exit{width:36px;height:36px;padding:0;border:0;background:transparent;color:#aaa;font-size:32px;line-height:1;font-weight:400;display:flex;align-items:center;justify-content:center;box-shadow:none}
.exit:hover{color:#fff}
@media(max-width:600px){.row{align-items:flex-start}.row span:first-child{min-width:92px}.actions{flex-direction:column}}
</style>
</head>
<body>

<header>
  <div>
    <div class="logo">VIREXA X</div>
    <div class="admin">ADMIN PANEL</div>
  </div>
  <button class="exit" type="button" aria-label="Back to Store" title="Back to Store" onclick="goBackToStore()">×</button>
</header>

<main>
<h1>PRODUCT MANAGEMENT</h1>

<div class="panel">
  <h2 id="formTitle">ADD PRODUCT</h2>
  <div class="small">Create or edit a product. Changes are saved directly to Supabase.</div>

  <form class="form" id="productForm">
    <input id="name" placeholder="Product name" required>
    <textarea id="description" placeholder="Description"></textarea>
    <select id="network" required>
      <option value="RUPAY">RUPAY</option>
      <option value="VISA">VISA</option>
      <option value="MASTERCARD">MASTERCARD</option>
      <option value="AMERICAN EXPRESS">AMERICAN EXPRESS</option>
    </select>
    <select id="status">
      <option value="AVAILABLE">AVAILABLE</option>
      <option value="HIDDEN">HIDDEN</option>
    </select>
    <input id="brand" placeholder="Network/Brand" value="VIREXA X">
    <input id="cardNumber" placeholder="Masked card number e.g. •••• •••• •••• 5467">
    <input id="holder" placeholder="Card holder name">
    <input id="balance" type="number" min="0" placeholder="Balance">
    <input id="limit" type="number" min="0" placeholder="Limit">
    <input id="expiry" placeholder="Expiry e.g. 12/30">
    <input id="delivery" placeholder="Delivery" value="Digital">
    <input id="fee" type="number" min="0" placeholder="Entry fee">
    <input id="quantity" type="number" min="1" value="1" placeholder="Stock/Quantity">
<div class="panel" style="margin-top:10px;padding:12px">
  <h2 style="margin-bottom:10px">CUSTOM FIELDS</h2>

  <div id="customFields"></div>

  <button
    type="button"
    class="secondary"
    onclick="addCustomField()">
    + ADD FIELD
  </button>
</div>
    <div class="form-actions">
      <button class="primary" id="saveBtn" type="submit">ADD PRODUCT</button>
      <button class="secondary" id="cancelBtn" type="button" style="display:none">CANCEL EDIT</button>
    </div>
  </form>
  <div class="msg" id="msg"></div>
</div>

<div class="panel">
  <h2>PRODUCTS</h2>
  <div id="products">Loading...</div>
</div>
</main>

<script>
'use strict';

function goBackToStore(){
  if(window.history.length > 1){
    window.history.back();
  }else{
    window.location.href='index.html';
  }
}


  function addCustomField(fieldName='', fieldValue=''){
  const wrap=document.createElement('div');

  wrap.className='custom-field';
  wrap.style.marginBottom='10px';

  wrap.innerHTML=`
    <input class="meta-name" placeholder="Field Name" value="${escapeHtml(fieldName)}">
    <input class="meta-value" placeholder="Value" value="${escapeHtml(fieldValue)}">
    <button
      type="button"
      class="danger"
      onclick="this.parentElement.remove()">
      Remove
    </button>
  `;

  document.getElementById('customFields').appendChild(wrap);
}

function collectMetadata(){
  const metadata={};

  document.querySelectorAll('#customFields .custom-field')
    .forEach(row=>{
      const name=row.querySelector('.meta-name').value.trim();
      const value=row.querySelector('.meta-value').value.trim();

      if(name){
        metadata[name]=value;
      }
    });

  return metadata;
}
const SUPABASE_URL='https://esefauysqukcnlmpexvp.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_ojRLCERTzPJSTbBopO0KGA_CN6DDcA_';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);

const form=document.getElementById('productForm');
const msg=document.getElementById('msg');
const products=document.getElementById('products');
const formTitle=document.getElementById('formTitle');
const saveBtn=document.getElementById('saveBtn');
const cancelBtn=document.getElementById('cancelBtn');
let editingId=null;

async function checkAdmin(){
  const sessionResult=await sb.auth.getSession();
  const session=sessionResult.data.session;
  if(!session){
    document.body.innerHTML='<div style="padding:40px;text-align:center;color:#fff;background:#050505;min-height:100vh">Please login first.</div>';
    return false;
  }
  const result=await sb.from('users').select('role').eq('auth_user_id',session.user.id).maybeSingle();
  if(result.error || !result.data || result.data.role!=='admin'){
    document.body.innerHTML='<div style="padding:40px;text-align:center;color:#fff;background:#050505;min-height:100vh">Admin access required.</div>';
    return false;
  }
  return true;
}

function val(id){return document.getElementById(id).value.trim()}
function num(id,def=0){return Number(document.getElementById(id).value||def)}

function productFromForm(){
  return {
    name:val('name'),
    description:val('description'),
    network:document.getElementById('network').value,
    status:document.getElementById('status').value,
    card_brand:val('brand'),
    card_number:val('cardNumber'),
    card_holder:val('holder'),
    balance:num('balance'),
    card_limit:num('limit'),
    expiry:val('expiry'),
    delivery:val('delivery'),
    entry_fee:num('fee'),
    quantity:num('quantity',1),
metadata:collectMetadata()
  };
}

function fillForm(p){
  document.getElementById('name').value=p.name||'';
  document.getElementById('description').value=p.description||'';
  document.getElementById('network').value=p.network||p.card_brand||'RUPAY';
  document.getElementById('status').value=p.status||'AVAILABLE';
  document.getElementById('brand').value=p.card_brand||'VIREXA X';
  document.getElementById('cardNumber').value=p.card_number||'';
  document.getElementById('holder').value=p.card_holder||'';
  document.getElementById('balance').value=p.balance??'';
  document.getElementById('limit').value=p.card_limit??'';
  document.getElementById('expiry').value=p.expiry||'';
  document.getElementById('delivery').value=p.delivery||'Digital';
  document.getElementById('fee').value=p.entry_fee??'';
  document.getElementById('quantity').value=p.quantity??1;
}

function startEdit(p){
  editingId=p.id;
  fillForm(p);
  formTitle.textContent='EDIT PRODUCT';
  saveBtn.textContent='SAVE CHANGES';
  cancelBtn.style.display='block';
  window.scrollTo({top:0,behavior:'smooth'});
}

function cancelEdit(){
  editingId=null;
  form.reset();
  document.getElementById('network').value='RUPAY';
  document.getElementById('brand').value='VIREXA X';
  document.getElementById('delivery').value='Digital';
  document.getElementById('quantity').value='1';
  formTitle.textContent='ADD PRODUCT';
  saveBtn.textContent='ADD PRODUCT';
  cancelBtn.style.display='none';
  msg.textContent='';
}

async function loadProducts(){
  const result=await sb.from('products').select('*').order('created_at',{ascending:false});
  if(result.error){products.textContent=result.error.message;return}
  if(!result.data.length){products.textContent='No products added yet.';return}

  products.innerHTML=result.data.map(p=>`
    <div class="product">
      <span class="badge">${escapeHtml(p.status||'AVAILABLE')}</span>
      <div class="product-title">${escapeHtml(p.name||'Unnamed product')}</div>
      <div class="row"><span>Description</span><span>${escapeHtml(p.description||'-')}</span></div>
      <div class="row"><span>Network</span><span>${escapeHtml(p.network||p.card_brand||'-')}</span></div>
      <div class="row"><span>Brand</span><span>${escapeHtml(p.card_brand||'-')}</span></div>
      <div class="row"><span>Card</span><span>${escapeHtml(p.card_number||'-')}</span></div>
      <div class="row"><span>Holder</span><span>${escapeHtml(p.card_holder||'-')}</span></div>
      <div class="row"><span>Balance</span><span>₹${Number(p.balance||0).toFixed(2)}</span></div>
      <div class="row"><span>Limit</span><span>₹${Number(p.card_limit||0).toFixed(2)}</span></div>
      <div class="row"><span>Expiry</span><span>${escapeHtml(p.expiry||'-')}</span></div>
      <div class="row"><span>Delivery</span><span>${escapeHtml(p.delivery||'-')}</span></div>
      <div class="row"><span>Entry Fee</span><span>₹${Number(p.entry_fee||0).toFixed(2)}</span></div>
      <div class="row"><span>Stock/Quantity</span><span>${Number(p.quantity||0)}</span></div>
      <div class="actions">
        <button class="secondary" type="button" onclick='startEdit(${JSON.stringify(p).replace(/'/g,"&#39;")})'>EDIT</button>
        <button class="danger" type="button" onclick="deleteProduct(${p.id})">DELETE</button>
      </div>
    </div>
  `).join('');
}

form.addEventListener('submit',async function(e){
  e.preventDefault();
  msg.textContent=editingId?'Updating product...':'Saving product...';
  const product=productFromForm();

  let result;
  if(editingId){
    result=await sb.from('products').update(product).eq('id',editingId);
  }else{
    result=await sb.from('products').insert(product);
  }

  if(result.error){
    msg.textContent=result.error.message;
    return;
  }

  msg.textContent=editingId?'Product updated successfully.':'Product added successfully.';
  cancelEdit();
  msg.textContent=editingId?'Product updated successfully.':'Product added successfully.';
  await loadProducts();
});

cancelBtn.addEventListener('click',cancelEdit);

async function deleteProduct(id){
  if(!confirm('Delete this product?')) return;
  const result=await sb.from('products').delete().eq('id',id);
  if(result.error){alert(result.error.message);return}
  await loadProducts();
}

function escapeHtml(value){
  return String(value??'')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#039;');
}

(async function(){
  const ok=await checkAdmin();
  if(ok) await loadProducts();
})();
</script>
</body>
</html>
